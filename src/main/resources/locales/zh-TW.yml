      state:
        name: <gold>相容性</gold>
        description:
          COMPATIBLE: |
            <green>目前執行於 </green><yellow>[name] [version]</yellow><green>。</green>

            <green>BentoBox 目前執行於</green>
            <green><bold>完全相容的 </bold></green><green>伺服器軟體與</green>
            <green>版本。</green>

            <green>所有功能皆已針對此環境</green>
            <green>完整設計與最佳化。</green>
          SUPPORTED: |
            <green>目前執行於 </green><yellow>[name] [version]</yellow><green>。</green>

            <green>BentoBox 目前執行於</green>
            <green><bold>支援的 </bold></green><green>伺服器軟體與</green>
            <green>版本。</green>

            <green>大部分功能都能在此環境中</green>
            <green>穩定運作。</green>
          NOT_SUPPORTED: |
            <green>目前執行於 </green><yellow>[name] [version]</yellow><green>。</green>

            <green>BentoBox 目前執行於</green>
            <gold><bold>不受支援的 </bold></gold><green>伺服器軟體或</green>
            <green>版本。</green>

            <green>雖然大部分功能仍可正常運作，</green>
