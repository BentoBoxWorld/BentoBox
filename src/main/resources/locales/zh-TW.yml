# -----------------------------------------------------------------------------
# Traditional Chinese (Taiwan) localization for BentoBox
# Based on the official en-US.yml
# -----------------------------------------------------------------------------

# This locale is always current with the latest version
meta:
  authors:
  - tastybento
  - Poslovitch
  banner: WHITE_BANNER:1:STRIPE_SMALL:RED:SQUARE_TOP_RIGHT:CYAN:SQUARE_TOP_RIGHT:BLUE

prefixes:
  bentobox: <gold>BentoBox </gold><gray><bold>> </bold></gray>
  island: 島嶼
  Island: 島嶼
  Islands: 島嶼
  an-island: 一座島嶼
  islands: 島嶼
general:
  success: <green>成功！</green>
  invalid: 無效
  beta: <light_purple><bold>此指令仍處於 Beta 測試階段，請務必先做好備份！</bold></light_purple>
  errors:
    command-cancelled: <red>指令已取消。</red>
    no-permission: <red>你沒有權限執行此指令（</red><gray>[permission]</gray><red>）。</red>
    insufficient-rank: <red>你的權限等級不足，無法執行此操作！（</red><gray>[rank]</gray><red>）</red>
    use-in-game: <red>此指令只能在遊戲內使用。</red>
    use-in-console: <red>此指令只能在主控台中使用。</red>
    no-team: <red>你沒有隊伍！</red>
    no-island: <red>你沒有[prefix_an-island]！</red>
    player-has-island: <red>該玩家已經擁有[prefix_an-island]！</red>
    player-has-no-island: <red>該玩家沒有[prefix_island]！</red>
    already-have-island: <red>你已經擁有[prefix_an-island]！</red>
    no-safe-location-found: <red>無法在[prefix_island]上找到可安全傳送的位置。</red>
    not-owner: <red>你不是[prefix_island]的島主！</red>
    player-is-not-owner: <aqua>[name] </aqua><red>不是[prefix_an-island]的島主！</red>
    not-in-team: <red>該玩家不在你的隊伍中！</red>
    offline-player: <red>該玩家目前離線或不存在。</red>
    unknown-player: <red>[name] 是未知的玩家！</red>
    general: <red>此指令尚未完成，請聯絡管理員。</red>
    unknown-command: <red>未知的指令。請輸入 </red><aqua>/[label] help </aqua><red>以查看說明。</red>
    wrong-world: <red>你目前所在的世界無法執行此操作！</red>
    you-must-wait: <red>你必須等待 [number] 秒後才能再次執行此指令。</red>
    must-be-positive-number: <red>[number] 不是有效的正整數。</red>
    not-on-island: <red>你目前不在[prefix_island]上！</red>
    slow-down: <red>請慢一點，點擊不要太快。</red>
  did-you-mean:
    suggestion: '<gray>你是不是想輸入 </gray><yellow>[command]</yellow><gray>？點擊這裡或輸入 </gray><green>yes</green><gray> 來執行。</gray>[run_command: [command]][hover: 點擊即可執行 [command]]'
    header: <gray>你是不是想輸入以下其中一個指令？點擊即可執行：</gray>
    option: '<yellow>  [command]</yellow>[run_command: [command]][hover: 點擊即可執行 [command]]'
  worlds:
    overworld: 主世界
    nether: 地獄
    the-end: 終界

commands:
  # Parameters in <> are required, parameters in [] are optional
  help:
    header: <gray>=========== </gray><red>[label] 說明 </red><gray>===========</gray>
    syntax: '<aqua>[usage] </aqua><green>[parameters]</green><gray>： </gray><yellow>[description]</yellow>'
    syntax-no-parameters: '<aqua>[usage]</aqua><gray>： </gray><yellow>[description]</yellow>'
    end: <gray>=================================</gray>
    page: <gray>第 </gray><yellow>[page]</yellow><gray> 頁，共 </gray><yellow>[total]</yellow><gray> 頁</gray>
    parameters: '[command]'
    description: 顯示說明
    console: 主控台
  admin:
    help:
      description: 管理員指令
    maxhomes:
      description: 變更此[prefix_island]或指定玩家[prefix_island]可設定的家數量
      parameters: <數量 / 玩家> <數量> [[prefix_island] 名稱]
      max-homes-set: <green>[name] - 已將[prefix_island]可設定的家數量設為 [number]</green>
      errors:
        unknown-island: 未知的[prefix_island]！[name]
    resethome:
      description: 將玩家的家重設為預設位置
      parameters: <玩家> [[prefix_island] 名稱]
      cleared: <aqua>已重設家。[name]</aqua>
    resets:
      description: 編輯玩家的重置次數
      set:
        description: 設定此玩家的[prefix_island]重置次數
        parameters: <玩家> <重置次數>
        success: <aqua>[name]</aqua><green> 的[prefix_island]重置次數已設為 </green><aqua>[number]</aqua><green>。</green>
      reset:
        description: 將玩家的[prefix_island]重置次數設為 0
        parameters: <玩家>
        success-everyone: <green>已成功將 </green><aqua>所有玩家</aqua><green> 的重置次數設為 </green><aqua>0</aqua><green>。</green>
        success: <green>已成功將 </green><aqua>[name]</aqua><green> 的重置次數設為 </green><aqua>0</aqua><green>。</green>
      add:
        description: 增加此玩家的[prefix_island]重置次數
        parameters: <玩家> <重置次數>
        success: <green>已成功為 </green><aqua>[name]</aqua><green> 增加 </green><aqua>[number]</aqua><green> 次重置，目前總重置次數為 </green><aqua>[total]</aqua><green> 次。</green>
      remove:
        description: 減少玩家的[prefix_island]重置次數
        parameters: <玩家> <重置次數>
        success: <green>已成功為 </green><aqua>[name]</aqua><green> 減少 </green><aqua>[number]</aqua><green> 次重置，目前總重置次數為 </green><aqua>[total]</aqua><green> 次。</green>
    purge:
      parameters: '[天數]'
      description: 刪除超過 [days] 天未使用的[prefix_Islands]區域檔案（釋放磁碟空間）
      days-one-or-more: <red>天數至少必須為 1 天以上。</red>
      purgable-islands: <green>找到 </green><aqua>[number] </aqua><green>個可清除的[prefix_Islands]。</green>
      purge-in-progress: <red>正在清除中，請等待作業完成。</red>
      scanning: <green>正在掃描區域檔案，依世界大小不同可能需要一些時間……</green>
      none-found: <red>沒有找到可清除的[prefix_Islands]。</red>
      confirm: <light_purple>請輸入 </light_purple><aqua>/[label] purge confirm </aqua><light_purple>開始清除</light_purple>
      failed: <red>清除完成，但發生錯誤。部分區域檔案無法刪除，請查看伺服器日誌以取得詳細資訊。</red>
      age-regions:
        parameters: '[天數]'
        description: '除錯／測試：修改區域檔案的時間戳記，使其符合可清除條件'
        done: <green>已將目前世界中的 </green><aqua>[number]</aqua><green> 個區域檔案設為可清除狀態。</green>
      deleted:
        parameters: ''
        description: 清除所有已標記為已刪除之[prefix_island]的區域檔案
        confirm: <light_purple>請輸入 </light_purple><aqua>/[label] purge deleted confirm </aqua><light_purple>開始清除區域檔案</light_purple>
        deferred: <green>區域檔案已清除。島嶼資料庫中的紀錄將於下次伺服器重新啟動時移除。</green>
      protect:
        description: 啟用或停用[prefix_island]的清除保護
        move-to-island: <red>請先移動到[prefix_an-island]！</red>
        protecting: <green>已啟用[prefix_island]的清除保護。</green>
        unprotecting: <green>已停用清除保護。</green>
      unowned:
        parameters: ''
        description: 將無人擁有的[prefix_Islands]標記為可刪除，以便清除其區域檔案
        unowned-islands: <green>找到 </green><aqua>[number] </aqua><green>個無人擁有的[prefix_Islands]。</green>
        flagged: <green>已將 </green><aqua>[number] </aqua><green>個[prefix_island]標記為可刪除。請執行 </green><aqua>/[label] purge deleted</aqua><green> 來清除區域檔案。</green>
    team:
      description: 管理隊伍
      add:
        parameters: <島主> <玩家>
        description: 將玩家加入島主的隊伍
        name-not-owner: <red>[name] 不是島主。</red>
        name-has-island: <red>[name] 已擁有[prefix_an-island]。請先解除註冊或刪除該島嶼！</red>
        success: <aqua>[name]</aqua><green> 已加入 </green><aqua>[owner]</aqua><green> 的[prefix_island]。</green>
      disband:
        parameters: <島主>
        description: 解散島主的隊伍
        use-disband-owner: <red>指定的玩家不是島主！請使用 disband [owner]。</red>
        disbanded: <red>管理員已解散你的隊伍！</red>
        success: <aqua>[name]</aqua><green> 的隊伍已解散。</green>
      disbandall:
        description: 移除此世界所有[prefix_island]的成員與副島主
        confirmation: <red>此操作將移除此世界所有[prefix_island]的成員與副島主，Trusted 與 Coop 玩家不會受到影響。請輸入確認指令以繼續。</red>
        success: <green>已從 </green><aqua>[islands]</aqua><green> 個[prefix_islands]移除 </green><aqua>[number]</aqua><green> 位成員。</green>
      fix:
        description: 掃描並修復資料庫中的跨[prefix_island]成員資料
        scanning: 正在掃描資料庫……
        duplicate-owner: '<red>玩家在資料庫中擁有超過一個[prefix_island]：[name]</red>'
        player-has: <red>玩家 [name] 擁有 [number] 個[prefix_islands]。</red>
        duplicate-member: <red>玩家 [name] 在資料庫中同時是多個[prefix_island]的成員。</red>
        rank-on-island: <red>[rank]（[prefix_island]，座標：[xyz]）</red>
        fixed: <green>已修復。</green>
        done: <green>掃描完成。</green>
      kick:
        parameters: <隊伍成員> [x,y,z]
        description: 將玩家踢出隊伍
        cannot-kick-owner: <red>你不能踢出島主。請先使用 </red><yellow>setowner</yellow><red> 轉移島嶼擁有權，或使用 </red><yellow>disband</yellow><red> 解散隊伍。</red>
        not-in-team: <red>這名玩家不在隊伍中。</red>
        admin-kicked: <red>管理員已將你踢出隊伍。</red>
        success: <aqua>[name] </aqua><green>已被踢出 </green><aqua>[owner]</aqua><green> 的[prefix_island]。</green>
      setowner:
        parameters: <玩家> [島主]
        description: 將[prefix_island]的擁有權轉移給指定玩家。若從主控台執行，請指定目前的島主
        already-owner: <red>[name] 已經是這座[prefix_island]的島主！</red>
        must-be-on-island: <red>你必須位於[prefix_island]上才能設定島主。</red>
        specify-island: '<red>請站在[prefix_island]上於遊戲內執行此指令，或指定目前的島主：</red><yellow>setowner <player> <island owner></yellow>'
        confirmation: <green>確定要將位於 [xyz] 的[prefix_island]島主設為 [name] 嗎？</green>
        success: <aqua>[name]</aqua><green> 現在是這座[prefix_island]的島主。</green>
        errors:
          at-max: <red>[name] 已擁有 [number] 個[prefix_islands]，已達設定或權限允許的上限（[max]）。請調整其權限以允許擁有更多島嶼。</red>
        extra-islands: '<red>警告：此玩家目前擁有 [number] 個[prefix_islands]，已超過設定或權限允許的上限（[max]）。</red>'
      maxsize:
        parameters: <玩家> <人數>
        description: 設定玩家[prefix_island]的隊伍人數上限（輸入 0 可重設為世界預設值）
        success: <green>已將 </green><aqua>[name]</aqua><green> 的[prefix_island]隊伍人數上限設為 </green><aqua>[number]</aqua><green>。</green>
        reset: <green>已將 </green><aqua>[name]</aqua><green> 的[prefix_island]隊伍人數上限重設為世界預設值（</green><aqua>[number]</aqua><green>）。</green>
    range:
      description: 管理員[prefix_island]保護範圍指
      invalid-value:
        too-low: <red>保護範圍必須大於 </red><aqua>1</aqua><red>！</red>
        too-high: <red>保護範圍必須小於或等於 </red><aqua>[number]</aqua><red>！</red>
        same-as-before: <red>保護範圍已經設為 </red><aqua>[number]</aqua><red>！</red>
      display:
        already-off: <red>範圍指示器已經關閉。</red>
        already-on: <red>範圍指示器已經開啟。</red>
        description: 顯示／隱藏[prefix_island]保護範圍指示器
        hiding: <dark_green>正在隱藏範圍指示器。</dark_green>
        hint: |-
          <red>紅色屏障圖示 </red><white>表示目前[prefix_island]的保護範圍邊界。</white>
          <gray>灰色粒子 </gray><white>表示[prefix_island]可設定的最大範圍。</white>
          <green>綠色粒子 </green><white>表示預設的保護範圍（僅在[prefix_island]目前的保護範圍與預設值不同時顯示）。</white>
        showing: <dark_green>正在顯示範圍指示器。</dark_green>
      set:
        parameters: <玩家> <範圍> [[prefix_island] 座標]
        description: 設定[prefix_island]的保護範圍
        success: <green>已將[prefix_island]的保護範圍設為 </green><aqua>[number]</aqua><green>。</green>
      reset:
        parameters: <玩家>
        description: 將[prefix_island]的保護範圍重設為世界預設值
        success: <green>已將[prefix_island]的保護範圍重設為 </green><aqua>[number]</aqua><green>。</green>
      add:
        description: 增加[prefix_island]的保護範圍
        parameters: <玩家> <範圍> [[prefix_island] 座標]
        success: <green>已成功將 </green><aqua>[name]</aqua><green> 的[prefix_island]保護範圍增加至 </green><aqua>[total]</aqua><green> </green><gray>(</gray><aqua>+[number]</aqua><gray>)</gray><green>。</green>
      remove:
        description: 減少[prefix_island]的保護範圍
        parameters: <玩家> <範圍> [[prefix_island] 座標]
        success: <green>已成功將 </green><aqua>[name]</aqua><green> 的[prefix_island]保護範圍減少至 </green><aqua>[total]</aqua><green> </green><gray>(</gray><aqua>-[number]</aqua><gray>)</gray><green>。</green>
      removebonus:
        parameters: <玩家> [ID]
        description: 移除[prefix_island]的額外保護範圍（可移除全部或依 ID 移除）
        no-bonus: <red>這座[prefix_island]沒有可移除的額外保護範圍！</red>
        unknown-bonus: <red>這座[prefix_island]沒有 ID 為 </red><aqua>[id]</aqua><red> 的額外保護範圍！</red>
        success: <green>已從 </green><aqua>[name]</aqua><green> 的[prefix_island]移除 </green><aqua>[number]</aqua><green> 個額外保護範圍。</green>
        success-id: <green>已從 </green><aqua>[name]</aqua><green> 的[prefix_island]移除額外保護範圍 </green><aqua>[id]</aqua><green>（</green><aqua>[number]</aqua><green>）。</green>
      purgebonus:
        parameters: <ID>
        description: 從所有[prefix_islands]移除指定 ID 的額外保護範圍（例如移除新增該範圍的附加元件後）
        none: <red>沒有任何[prefix_island]擁有 ID 為 </red><aqua>[id]</aqua><red> 的額外保護範圍！</red>
        warning: <gold>此操作將從 </gold><aqua>[number]</aqua><gold> 個[prefix_islands]移除 ID 為 </gold><aqua>[id]</aqua><gold> 的額外保護範圍。</gold>
        success: <green>已從 </green><aqua>[number]</aqua><green> 個[prefix_islands]移除 ID 為 </green><aqua>[id]</aqua><green> 的額外保護範圍。</green>
        confirm: <gold>若要繼續，請再次執行此指令並加上 </gold><aqua>confirm</aqua><gold>。</gold>
        in-progress: <red>正在執行額外保護範圍清除作業，請稍候。</red>
        failed: <red>掃描島嶼失敗，請查看主控台。</red>
    register:
      parameters: <玩家>
      description: 將玩家註冊為目前所在未擁有的[prefix_island]島主
      registered-island: <green>已將位於 [xyz] 的[prefix_island]註冊給 [name]。</green>
      reserved-island: <green>已為 [name] 保留位於 [xyz] 的[prefix_island]。</green>
      already-owned: <red>這座[prefix_island]已由其他玩家擁有！</red>
      no-island-here: <red>此處沒有[prefix_island]。請再次執行此指令以確認建立。</red>
      in-deletion: <gold>這座[prefix_island]正等待刪除。若註冊此島嶼，將會取消刪除作業。請再次執行此指令以確認。</gold>
      cannot-make-island: <red>無法在此建立[prefix_an-island]。請查看主控台以取得可能的錯誤資訊。</red>
      island-is-spawn: <gold>這座[prefix_island]是世界出生點。確定要繼續嗎？請再次執行此指令以確認。</gold>
    undelete:
      description: 取消目前所在未擁有[prefix_island]的待刪除狀態
      not-in-deletion: <red>這座[prefix_island]目前未處於待刪除狀態。</red>
      undeleted-island: <green>已移除位於 [xyz] 的[prefix_island]待刪除狀態。該島嶼現在為無人擁有。</green>
    unregister:
      parameters: <島主> [x,y,z]
      description: 解除[prefix_island]島主的註冊，但保留[prefix_island]上的方塊
      unregistered-island: <green>已解除 [name] 對位於 [xyz] 的[prefix_island]的註冊。</green>
      errors:
        unknown-island-location: <red>找不到[prefix_island]的位置。</red>
        specify-island-location: <red>請以 x,y,z 格式指定[prefix_island]的位置。</red>
        player-has-more-than-one-island: <red>該玩家擁有多座[prefix_islands]，請指定要解除註冊的島嶼。</red>
    info:
      parameters: <玩家>
      description: 查看目前所在或指定玩家的[prefix_island]資訊
      no-island: <red>你目前不在[prefix_an-island]上……</red>
      title: ========== [prefix_Island]資訊 ==========
      island-uuid: 'UUID： [uuid]'
      owner: '島主： [owner]（[uuid]）'
      last-login: '最後登入： [date]'
      last-login-date-time-format: EEE MMM dd HH:mm:ss zzz yyyy
      deaths: '死亡次數： [number]'
      resets-left: '重置次數： [number]（上限： [total]）'
      max-homes: '家的數量上限： [number]'
      team-members-title: '隊伍成員：'
      team-owner-format: <green>[name] [rank]</green>
      team-member-format: <aqua>[name] [rank]</aqua>
      max-team-size: '隊伍人數上限： [number]'
      max-coop-size: 'Coop 人數上限： [number]'
      max-trusted-size: 'Trusted 人數上限： [number]'
      island-protection-center: '保護區域中心： [xyz]'
      island-center: '[prefix_Island]中心： [xyz]'
      island-coords: '[prefix_Island]座標： [xz1] ～ [xz2]'
      islands-in-trash: <light_purple>玩家有島嶼位於回收區。</light_purple>
      protection-range: '保護範圍： [range]'
      protection-range-bonus-title: <aqua>包含以下額外保護範圍：</aqua>
      protection-range-bonus: '額外保護範圍： [number]'
      purge-protected: '[prefix_Island]已啟用清除保護'
