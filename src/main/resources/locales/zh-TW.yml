            <gold>或其他問題。</gold>
          INCOMPATIBLE: |
            <green>目前執行於 </green><yellow>[name] [version]</yellow><green>。</green>

            <green>BentoBox 目前執行於</green>
            <red><bold>不相容的 </bold></red><green>伺服器軟體或</green>
            <green>版本。</green>

            <red>可能會出現異常行為與錯誤，</red>
